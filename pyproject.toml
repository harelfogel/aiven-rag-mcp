[project]
name = "rag-mcp"
version = "0.1.0"
description = "RAG MCP server over the Aiven devportal: ingest, hybrid search, list_sources"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
rag-mcp = "rag_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# cryptography >= 49 ships no macOS wheel for Intel Macs and needs a Rust toolchain to build.
# It is only pulled in by mcp -> pyjwt[crypto]; 48.x has the same API and prebuilt wheels everywhere.
constraint-dependencies = ["cryptography<49"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (docker compose up -d db)"]
