[project]
name = "rag-mcp"
version = "0.1.0"
description = "RAG MCP server over the Aiven devportal: ingest, hybrid search, list_sources"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastembed>=0.9",
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
rag-mcp = "rag_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# Two transitive packages dropped Intel-Mac wheels; the pinned versions have wheels on every
# platform we build for, and one lockfile then works on the dev Mac and in the Linux image.
#   cryptography >= 49 (via mcp -> pyjwt[crypto]) needs a Rust toolchain to build from source.
#   onnxruntime >= 1.24 (via fastembed) has no macOS x86_64 wheel at all.
constraint-dependencies = ["cryptography<49", "onnxruntime<1.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres (docker compose up -d db)",
    "slow: walks the whole devportal corpus",
]
